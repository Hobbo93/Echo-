<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECHO AI Headquarters</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080d1c;
color:white;
font-family:Arial,sans-serif;
}
header{
padding:15px;
background:#101a32;
display:flex;
justify-content:space-between;
align-items:center;
}
h1{
margin:0;
color:#65e8ff;
font-size:21px;
}
button{
background:#177ca0;
color:white;
border:0;
border-radius:8px;
padding:10px;
cursor:pointer;
margin:3px;
}
button:hover{background:#249ac4}
input,textarea,select{
width:100%;
padding:10px;
margin:6px 0 12px;
background:#18243e;
color:white;
border:1px solid #395171;
border-radius:7px;
}
textarea{min-height:70px}
.layout{
display:grid;
grid-template-columns:290px 1fr 290px;
height:calc(100vh - 60px);
}
.panel{
padding:15px;
background:#10192e;
overflow:auto;
}
#scene{
position:relative;
overflow:hidden;
background:#101a32;
}
canvas{
width:100%;
height:100%;
display:block;
touch-action:none;
}
.label{
position:absolute;
background:#10192eee;
border:1px solid #55dfff;
border-radius:8px;
padding:7px;
font-size:12px;
cursor:pointer;
transform:translate(-50%,-50%);
white-space:nowrap;
}
#messages{
height:40vh;
overflow:auto;
border:1px solid #34435d;
padding:10px;
margin-bottom:10px;
}
.message{
padding:9px;
margin:7px 0;
border-radius:8px;
background:#26344e;
white-space:pre-wrap;
overflow-wrap:anywhere;
}
.user{background:#125b76}
.small{
font-size:12px;
color:#aabbd2;
}
@media(max-width:850px){
.layout{
display:flex;
flex-direction:column;
height:auto;
}
#scene{height:420px}
}
</style>
</head>

<body>

<header>
<h1>🧠 ECHO HEADQUARTERS</h1>
<span id="connection">Office Ready</span>
</header>

<div class="layout">

<section class="panel">
<h3>Echo Chat</h3>

<div id="messages"></div>

<textarea
id="prompt"
placeholder="Give an employee a task">
</textarea>

<button onclick="sendMessage()">
Send Message
</button>

<h3>Server Connection</h3>

<input
id="server"
value="http://127.0.0.1:5000">

<button onclick="testConnection()">
Test Connection
</button>

<p class="small">
Ollama connection requires the Python backend.
</p>
</section>

<main id="scene">
<canvas id="office"></canvas>
<div id="labels"></div>
</main>

<section class="panel">

<h3>AI Employee Manager</h3>

<label>Choose Room</label>
<select
id="roomSelect"
onchange="selectRoom(Number(this.value))">
</select>

<label>Employee Name</label>
<input id="employeeName">

<label>Employee Job</label>
<input id="employeeRole">

<label>AI Model</label>
<input id="employeeModel" value="llama3.2">

<label>Instructions</label>
<textarea id="employeeInstructions"></textarea>

<button onclick="saveEmployee()">
Save Employee
</button>

<button onclick="addRoom()">
Add Room
</button>

<button onclick="removeRoom()">
Remove Room
</button>

<h3>Employees</h3>
<div id="employeeStatus"></div>

</section>
</div>

<script type="module">

// The 3D view needs internet for three.js. If it can't load,
// the office still works as a chat page.
let THREE=null;
try{
THREE=await import(
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
);
}catch{
document.getElementById("scene").insertAdjacentHTML("afterbegin",
'<p class="small" style="padding:20px;position:absolute">3D view unavailable '+
'(no internet). Chat still works.</p>');
}

const STORAGE="echo_office_v1";

// Matches the employees built into echo_server.py.
// Leave instructions empty to use the server's built-in instructions.
const staff=[
["Content Creator","Video Editing & Social Media Manager"],
["Trading Analyst","Market Research and Trading Analysis"],
["Shopify Manager","Online Store Management"],
["Website and Leads Manager","Adelaide Business Research"],
["Research Assistant","General Research"],
["Technical Support","Echo Diagnostics and Maintenance"],
["Communications Assistant","Calls, Emails and Notifications"],
["Office Coordinator","Employee Coordination and Reporting"]
];

const defaults=staff.map(([name,role],i)=>({
id:i+1,
name,
role,
model:"llama3.2",
instructions:""
}));

let rooms;

try{
const saved=JSON.parse(localStorage.getItem(STORAGE));
rooms=Array.isArray(saved)&&saved.length
?saved:defaults;
}catch{
rooms=defaults;
}

// Rooms never edited from the old placeholder names get the real staff.
rooms=rooms.map(r=>{
const d=defaults[r.id-1];
return d&&r.name==="Employee "+r.id&&r.role==="Unassigned"
&&!r.instructions?{...d,model:r.model||d.model}:r;
});

// Chat history per room, kept while the page is open.
const histories={};

let selected=0;

const $=id=>document.getElementById(id);

const save=()=>localStorage.setItem(
STORAGE,JSON.stringify(rooms)
);

let scene,camera,renderer,brain,core;

if(THREE){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1428);

camera=new THREE.PerspectiveCamera(
45,1,.1,1000
);

renderer=new THREE.WebGLRenderer({
canvas:$("office"),
antialias:true
});

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

scene.add(new THREE.AmbientLight(0xffffff,1.5));

const light=new THREE.PointLight(0x55ddff,100);
light.position.set(0,10,0);
scene.add(light);

const floor=new THREE.Mesh(
new THREE.BoxGeometry(28,.4,28),
new THREE.MeshStandardMaterial({
color:0x182a46
})
);

floor.position.y=-.3;
scene.add(floor);

const grid=new THREE.GridHelper(
28,28,0x377ca0,0x284260
);

grid.position.y=-.08;
scene.add(grid);

brain=new THREE.Mesh(
new THREE.IcosahedronGeometry(2,3),
new THREE.MeshStandardMaterial({
color:0x49dfff,
emissive:0x1177cc,
emissiveIntensity:1.3,
wireframe:true
})
);

brain.position.y=3;
scene.add(brain);

core=new THREE.Mesh(
new THREE.SphereGeometry(1.3,32,32),
new THREE.MeshStandardMaterial({
color:0x66ddff,
emissive:0x1888ff,
emissiveIntensity:1,
transparent:true,
opacity:.65
})
);

core.position.y=3;
scene.add(core);

}

const roomObjects=[];

const colors=[
0x4d8dff,
0x9d70ff,
0xff70bb,
0xffa75a,
0x5de3c0,
0xffdd65,
0x75cfff,
0x9fe96e
];

function createRoom(i,total){

const angle=i/total*Math.PI*2;

const x=Math.cos(angle)*10;
const z=Math.sin(angle)*10;

const group=new THREE.Group();
group.position.set(x,0,z);

const base=new THREE.Mesh(
new THREE.BoxGeometry(4,.3,4),
new THREE.MeshStandardMaterial({
color:colors[i%8]
})
);

group.add(base);

const desk=new THREE.Mesh(
new THREE.BoxGeometry(2.4,.2,1.1),
new THREE.MeshStandardMaterial({
color:0x354966
})
);

desk.position.y=1;
group.add(desk);

const monitor=new THREE.Mesh(
new THREE.BoxGeometry(1.1,.8,.1),
new THREE.MeshStandardMaterial({
color:0x5beaff,
emissive:0x1877aa,
emissiveIntensity:.8
})
);

monitor.position.set(0,1.55,-.25);
group.add(monitor);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.38,16,16),
new THREE.MeshStandardMaterial({
color:0xffd2a0
})
);

head.position.set(0,1.65,1);
group.add(head);

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.35,.45,1,12),
new THREE.MeshStandardMaterial({
color:colors[i%8]
})
);

body.position.set(0,.85,1);
group.add(body);

scene.add(group);

roomObjects.push({group,x,z});
}

function rebuild(){

if(THREE){
roomObjects.forEach(o=>scene.remove(o.group));
roomObjects.length=0;

rooms.forEach((_,i)=>createRoom(i,rooms.length));
}

refresh();
}

function refresh(){

$("labels").innerHTML="";
$("roomSelect").innerHTML="";

rooms.forEach((r,i)=>{

const option=document.createElement("option");

option.value=i;
option.textContent="Room "+r.id+" - "+r.name;

$("roomSelect").appendChild(option);

const label=document.createElement("div");

label.className="label";
label.textContent="Room "+r.id+" - "+r.name;
label.dataset.index=i;

label.onclick=()=>selectRoom(i);

$("labels").appendChild(label);

});

$("employeeStatus").innerHTML="";

rooms.forEach(r=>{

const p=document.createElement("p");

p.className="small";
p.textContent=r.name+" - "+r.role;

$("employeeStatus").appendChild(p);

});
}

window.selectRoom=function(i){

selected=Math.max(
0,Math.min(i,rooms.length-1)
);

const r=rooms[selected];

$("roomSelect").value=selected;
$("employeeName").value=r.name;
$("employeeRole").value=r.role;
$("employeeModel").value=r.model;
$("employeeInstructions").value=r.instructions;
};

window.saveEmployee=function(){

const r=rooms[selected];

r.name=$("employeeName").value.trim()
||"Employee";

r.role=$("employeeRole").value.trim()
||"Unassigned";

delete histories[r.id];

r.model=$("employeeModel").value.trim()
||"llama3.2";

r.instructions=$("employeeInstructions").value.trim();

save();
refresh();
selectRoom(selected);

alert("Employee saved");
};

window.addRoom=function(){

if(rooms.length>=16)
return alert("Maximum 16 rooms");

rooms.push({
id:Math.max(...rooms.map(r=>r.id))+1,
name:"New Employee",
role:"Unassigned",
model:"llama3.2",
instructions:""
});

selected=rooms.length-1;

save();
rebuild();
selectRoom(selected);
};

window.removeRoom=function(){

if(rooms.length<=1)return;

rooms.splice(selected,1);

selected=0;

save();
rebuild();
selectRoom(0);
};

function resize(){

if(!THREE)return;

const el=$("scene");

const w=el.clientWidth;
const h=el.clientHeight;

renderer.setSize(w,h,false);

camera.aspect=w/h;
camera.updateProjectionMatrix();
}

window.addEventListener("resize",resize);

let orbit=.7;
let elevation=.8;
let distance=29;

let dragging=false;
let lastX=0;
let lastY=0;

function updateCamera(){

if(!THREE)return;

camera.position.set(
Math.sin(orbit)*Math.cos(elevation)*distance,
Math.sin(elevation)*distance,
Math.cos(orbit)*Math.cos(elevation)*distance
);

camera.lookAt(0,1,0);
}

const canvas=$("office");

canvas.addEventListener("pointerdown",e=>{

dragging=true;
lastX=e.clientX;
lastY=e.clientY;

canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener(
"pointerup",()=>dragging=false
);

canvas.addEventListener("pointermove",e=>{

if(!dragging)return;

orbit-=(e.clientX-lastX)*.008;

elevation=Math.max(
.15,
Math.min(
1.4,
elevation+(e.clientY-lastY)*.006
)
);

lastX=e.clientX;
lastY=e.clientY;

updateCamera();
});

canvas.addEventListener("wheel",e=>{

e.preventDefault();

distance=Math.max(
12,
Math.min(48,distance+e.deltaY*.025)
);

updateCamera();

},{passive:false});

function animate(t){

requestAnimationFrame(animate);

brain.rotation.y+=.005;

brain.rotation.x=Math.sin(t*.001)*.12;

core.scale.setScalar(
1+Math.sin(t*.003)*.06
);

renderer.render(scene,camera);

document.querySelectorAll(".label").forEach(label=>{

const i=Number(label.dataset.index);
const obj=roomObjects[i];

if(!obj)return;

const point=new THREE.Vector3(
obj.x,3.5,obj.z
);

point.project(camera);

label.style.left=
((point.x+1)/2*canvas.clientWidth)+"px";

label.style.top=
((-point.y+1)/2*canvas.clientHeight)+"px";

label.style.display=
point.z>1?"none":"block";

});
}

function addMessage(text,user=false){

const div=document.createElement("div");

div.className="message"+(user?" user":"");

div.textContent=text;

$("messages").appendChild(div);

$("messages").scrollTop=
$("messages").scrollHeight;
}

function serverURL(){

return $("server").value.trim()
.replace(/\/+$/,"");
}

window.testConnection=async function(){

try{

const response=await fetch(
serverURL()+"/health",
{
signal:AbortSignal.timeout(5000)
}
);

if(!response.ok)
throw Error("Server returned "+response.status);

$("connection").textContent="Server Connected";

addMessage("Connected to Echo's server.");

}catch(error){

$("connection").textContent="Server Offline";

addMessage(
"Server unavailable: "+error.message
);

}
};

window.sendMessage=async function(){

const prompt=$("prompt").value.trim();

if(!prompt)return;

$("prompt").value="";

const employee=rooms[selected];

addMessage(
"To "+employee.name+": "+prompt,
true
);

const history=histories[employee.id]||(histories[employee.id]=[]);

addMessage(employee.name+" is thinking…");
const thinking=$("messages").lastChild;

try{

const response=await fetch(
serverURL()+"/api/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:prompt,
history:history.slice(-16),
employee_id:"employee_"+employee.id,
employee:{
name:employee.name,
role:employee.role,
model:employee.model,
instructions:employee.instructions
}
}),
signal:AbortSignal.timeout(120000)
}
);

const data=await response.json().catch(()=>({}));

if(!response.ok)
throw Error(data.error||("HTTP "+response.status));

const reply=data.reply||data.response||
"No response received.";

thinking.remove();

addMessage(employee.name+": "+reply);

history.push(
{role:"user",content:prompt},
{role:"assistant",content:reply}
);
history.splice(0,Math.max(0,history.length-16));

}catch(error){

thinking.remove();

addMessage(
"Echo is not connected yet. "+
"Start the Python backend and Ollama. "+
error.message
);

}
};

rebuild();
selectRoom(0);
resize();
updateCamera();

if(THREE)requestAnimationFrame(animate);

addMessage("Welcome to Echo Headquarters.");

// When opened from the Echo server, talk to that same server.
if(location.protocol.startsWith("http"))
$("server").value=location.origin;

testConnection();

// Enter sends; Shift+Enter adds a new line.
$("prompt").addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

</script>
</body>
</html>
