<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECHO AI Headquarters</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080d1c;
color:white;
font-family:Arial,sans-serif;
}
header{
padding:15px;
background:#101a32;
display:flex;
justify-content:space-between;
align-items:center;
}
h1{
margin:0;
color:#65e8ff;
font-size:21px;
}
button{
background:#177ca0;
color:white;
border:0;
border-radius:8px;
padding:10px;
cursor:pointer;
margin:3px;
}
button:hover{background:#249ac4}
#callButton{background:#1f9d55}
#callButton.oncall{background:#c0392b}
input,textarea,select{
width:100%;
padding:10px;
margin:6px 0 12px;
background:#18243e;
color:white;
border:1px solid #395171;
border-radius:7px;
}
textarea{min-height:70px}
.layout{
display:grid;
grid-template-columns:290px 1fr 290px;
height:calc(100vh - 60px);
}
.panel{
padding:15px;
background:#10192e;

}
#scene{

overflow:hidden;

}

height:100%;

cursor:pointer;
transform:translate(-50%,-50%);
white-space:nowrap;
}
#messages{
height:40vh;
overflow:auto;
border:1px solid #34435d;
padding:10px;
margin-bottom:10px;
}
.message{
padding:9px;
margin:7px 0;
border-radius:8px;
background:#26344e;
white-space:pre-wrap;
overflow-wrap:anywhere;
}
.user{background:#125b76}
.message img{max-width:100%;max-height:160px;border-radius:6px;display:block;margin-top:6px}
#photoPreview{display:flex;gap:6px;flex-wrap:wrap}
#photoPreview img{height:56px;border-radius:6px;border:1px solid #55dfff;cursor:pointer}
.small{
font-size:12px;
color:#aabbd2;
}
@media(max-width:850px){
.layout{
display:flex;
flex-direction:column;
height:auto;
}
#scene{height:420px}
}

</head>

<header>
<h1>🧠 ECHO HEADQUARTERS</h1>
<span id="connection">Office Ready</span>
</header>

<div class="layout">

<textarea
id="prompt"
placeholder="Give an employee a task">
</textarea>

<div id="photoPreview"></div>

Send Message
</button>

📷 Photo

</button>

Save Employee
</button>

Add Room

Remove Room
</button>

<h3>Employees</h3>
<div id="employeeStatus"></div>

</section>

<script type="module">

// The 3D view needs internet for three.js. If it can't load,
// the office still works as a chat page.
let THREE=null;
try{
THREE=await import(
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
);
}catch{
document.getElementById("scene").insertAdjacentHTML("afterbegin",
'<p class="small" style="padding:20px;position:absolute">3D view unavailable '+
'(no internet). Chat still works.</p>');
}

const STORAGE="echo_office_v1";

// Matches the employees built into echo_server.py.
// Leave instructions empty to use the server's built-in instructions.
const staff=[
["Content Creator","Video Editing & Social Media Manager"],
["Trading Analyst","Market Research and Trading Analysis"],
["Shopify Manager","Shopify Store Management and Product Research"],
["Website and Leads Manager","Adelaide Business Research"],
["Research Agent","AI Tools, Opportunities and Echo Upgrades"],
["Technical Support","Echo Diagnostics and Maintenance"],
["Communications Assistant","Calls, Emails and Notifications"],
["Operations Manager","Operations, Monitoring and Daily Reports"],
["Roblox Map Builder","Roblox Map Design and Building"],
["Day Trading Desk","Day Trading Analysis and Paper Trading"],
["Sales Agent","Sales, Outreach and Client Pipeline"],
["Marketing Manager","Marketing, Ads and Growth"],
["Finance Manager","Income, Expenses and Profit"],
["Customer Support","Customer Enquiries and Satisfaction"],
["CEO","Running the Whole AI Office"]
];

const defaults=staff.map(([name,role],i)=>({
id:i+1,
name,
role,
model:"llama3.2",
instructions:""
}));

let rooms;

try{
const saved=JSON.parse(localStorage.getItem(STORAGE));
rooms=Array.isArray(saved)&&saved.length
?saved:defaults;
}catch{
rooms=defaults;
}

// Rooms never edited from the old placeholder names get the real staff.
rooms=rooms.map(r=>{
const d=defaults[r.id-1];
return d&&r.name==="Employee "+r.id&&r.role==="Unassigned"
&&!r.instructions?{...d,model:r.model||d.model}:r;
});

// Renamed staff keep their office.
const RENAMED={"Research Assistant":"Research Agent","Office Coordinator":"Operations Manager"};
rooms=rooms.map(r=>{const n=RENAMED[r.name];if(!n)return r;const d=defaults.find(x=>x.name===n);return{...r,name:n,role:d.role};});

// New staff join existing offices once (without undoing your own edits).
try{
const joined=JSON.parse(localStorage.getItem("echo_staff_joined")||"[]");
defaults.forEach(d=>{
if(!joined.includes(d.name)&&!rooms.some(r=>r.name===d.name)&&rooms.length<16&&d.id>8){
rooms.push({...d,id:Math.max(...rooms.map(r=>r.id))+1});
}
if(!joined.includes(d.name))joined.push(d.name);
});
localStorage.setItem("echo_staff_joined",JSON.stringify(joined));
localStorage.setItem(STORAGE,JSON.stringify(rooms));
}catch{}

// Chat history per room, kept while the page is open.
const histories={};

let selected=0;

const $=id=>document.getElementById(id);

const save=()=>localStorage.setItem(
STORAGE,JSON.stringify(rooms)
);

let scene,camera,renderer,brain,core;
const people=[];      // one walking person per employee
const desks=[];       // desk + chair + screen per employee
const clickable=[];
let deskGroup=null;

// ---------- helpers ----------
const M=(color,opts={})=>new THREE.MeshStandardMaterial({color,roughness:.7,...opts});
function box(w,h,d,mat,x=0,y=0,z=0,parent){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
(parent||scene).add(m);return m;
}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,parent,seg=16){
const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
(parent||scene).add(m);return m;
}
function canvasTex(w,h,draw,repeat){
const c=document.createElement("canvas");c.width=w;c.height=h;
draw(c.getContext("2d"),w,h);
const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...repeat);}
t.anisotropy=8;return t;
}
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ---------- room size & walking grid ----------
const ROOM={x0:-14,x1:14,z0:-10,z1:9};
const CELL=.3;
const GW=Math.round((ROOM.x1-ROOM.x0)/CELL),GH=Math.round((ROOM.z1-ROOM.z0)/CELL);
let staticBlocked=new Uint8Array(GW*GH),blocked=new Uint8Array(GW*GH);
function blockRect(arr,x0,z0,x1,z1,margin=.28){
const a=Math.max(0,Math.floor((x0-margin-ROOM.x0)/CELL)),b=Math.min(GW-1,Math.floor((x1+margin-ROOM.x0)/CELL));
const c=Math.max(0,Math.floor((z0-margin-ROOM.z0)/CELL)),d=Math.min(GH-1,Math.floor((z1+margin-ROOM.z0)/CELL));
for(let i=a;i<=b;i++)for(let j=c;j<=d;j++)arr[j*GW+i]=1;
}
const toCell=(x,z)=>[Math.min(GW-1,Math.max(0,Math.floor((x-ROOM.x0)/CELL))),Math.min(GH-1,Math.max(0,Math.floor((z-ROOM.z0)/CELL)))];
const cellPos=(i,j)=>[ROOM.x0+(i+.5)*CELL,ROOM.z0+(j+.5)*CELL];
// Mark the main connected floor so paths never start in a sealed-off pocket.
let mainFloor=new Uint8Array(GW*GH);
function markMainFloor(){
const label=new Int32Array(GW*GH).fill(-1);let best=-1,bestSize=0,id=0;
for(let start=0;start<GW*GH;start++){
if(blocked[start]||label[start]!==-1)continue;
const q=[start];label[start]=id;let size=0;
while(q.length){const c=q.pop();size++;const i=c%GW,j=(c/GW)|0;
for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=i+a,y=j+b;if(x<0||y<0||x>=GW||y>=GH)continue;const m=y*GW+x;if(!blocked[m]&&label[m]===-1){label[m]=id;q.push(m);}}}
if(size>bestSize){bestSize=size;best=id;}id++;
}
mainFloor=new Uint8Array(GW*GH);for(let k=0;k<GW*GH;k++)mainFloor[k]=label[k]===best?1:0;
}
function nearestFree(i,j){
if(mainFloor[j*GW+i])return[i,j];
for(let r=1;r<20;r++)for(let di=-r;di<=r;di++)for(let dj=-r;dj<=r;dj++){
if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;
const a=i+di,b=j+dj;
if(a>=0&&b>=0&&a<GW&&b<GH&&mainFloor[b*GW+a])return[a,b];
}
return[i,j];
}
function lineFree(x0,z0,x1,z1){
const n=Math.ceil(Math.hypot(x1-x0,z1-z0)/(CELL*.5));
for(let k=0;k<=n;k++){
const [i,j]=toCell(x0+(x1-x0)*k/n,z0+(z1-z0)*k/n);
if(blocked[j*GW+i])return false;
}
return true;
}
// A* over the grid, then smoothed into straight walking lines.
function findPath(fx,fz,tx,tz){
const [si,sj]=nearestFree(...toCell(fx,fz)),[ti,tj]=nearestFree(...toCell(tx,tz));
const start=sj*GW+si,goal=tj*GW+ti;
const g=new Float32Array(GW*GH).fill(1e9),came=new Int32Array(GW*GH).fill(-1),closed=new Uint8Array(GW*GH);
const heap=[];const push=(n,f)=>{heap.push([f,n]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){let l=2*k+1,r=l+1,m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top[1];};
const h=n=>Math.hypot(n%GW-ti,Math.floor(n/GW)-tj);
g[start]=0;push(start,h(start));
let found=false;
while(heap.length){
const n=pop();if(closed[n])continue;closed[n]=1;
if(n===goal){found=true;break;}
const i=n%GW,j=Math.floor(n/GW);
for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
if(!di&&!dj)continue;
const a=i+di,b=j+dj;if(a<0||b<0||a>=GW||b>=GH)continue;
const m=b*GW+a;if(blocked[m]||closed[m])continue;
if(di&&dj&&(blocked[j*GW+a]||blocked[b*GW+i]))continue;
const ng=g[n]+(di&&dj?1.414:1);
if(ng<g[m]){g[m]=ng;came[m]=n;push(m,ng+h(m));}
}
}
let pts=[];
if(found){for(let n=goal;n!==-1;n=came[n])pts.push(cellPos(n%GW,Math.floor(n/GW)));pts.reverse();}
pts.push([tx,tz]);
if(!found)return[[tx,tz]];
// smooth
const out=[[fx,fz]];let k=0;
while(k<pts.length-1){
let far=k+1;
for(let m=pts.length-1;m>k+1;m--){if(lineFree(...(k===0?[fx,fz]:pts[k]),...pts[m])){far=m;break;}}
out.push(pts[far]);k=far;
}
return out.slice(1);
}

// ---------- textures ----------
function woodTexture(){
return canvasTex(1024,1024,(g)=>{
for(let row=0;row<24;row++){
let x=-(row%4)*110;
while(x<1024){
const len=220+Math.random()*200,s=150+Math.random()*28;
g.fillStyle=`rgb(${s+28},${s-2},${s-40})`;g.fillRect(x,row*43,len,43);
for(let k=0;k<7;k++){g.strokeStyle=`rgba(90,60,30,${.05+Math.random()*.08})`;g.lineWidth=1+Math.random();
g.beginPath();const y=row*43+3+Math.random()*37;g.moveTo(x,y);g.bezierCurveTo(x+len/3,y+4,x+len*2/3,y-4,x+len,y);g.stroke();}
g.fillStyle="rgba(50,30,15,.35)";g.fillRect(x,row*43,2,43);x+=len;
}
g.fillStyle="rgba(50,30,15,.3)";g.fillRect(0,row*43,1024,2);
}
},[3,2]);
}
function carpetTexture(color){
return canvasTex(256,256,(g)=>{
g.fillStyle=color;g.fillRect(0,0,256,256);
for(let k=0;k<5000;k++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},255,${Math.random()*.05})`;g.fillRect(Math.random()*256,Math.random()*256,2,2);}
g.strokeStyle="rgba(0,0,0,.12)";g.lineWidth=2;g.strokeRect(0,0,256,256);
},[8,4]);
}
function skylineTexture(){
return canvasTex(2048,512,(g,w,h)=>{
const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,"#7fb4e6");sky.addColorStop(.7,"#cfe3f2");sky.addColorStop(1,"#e8eef2");
g.fillStyle=sky;g.fillRect(0,0,w,h);
for(let layer=0;layer<3;layer++){
let x=0;
while(x<w){
const bw=60+Math.random()*130,bh=(120+Math.random()*260)*(1-layer*.25);
const shade=[[110,125,145],[85,100,120],[60,72,90]][layer];
g.fillStyle=`rgb(${shade})`;g.fillRect(x,h-bh,bw,bh);
g.fillStyle="rgba(255,240,200,.35)";
for(let wy=h-bh+10;wy<h-10;wy+=14)for(let wx=x+6;wx<x+bw-8;wx+=12)if(Math.random()<.35)g.fillRect(wx,wy,6,7);
x+=bw+Math.random()*20;
}
}
});
}

// ---------- people ----------
const SKIN=[0xf3cfb3,0xe0b08a,0xc68c62,0x9a6440,0x6e4428,0xf0c3a0];
const HAIR=[0x1e140c,0x3b2616,0x5a3a22,0x0d0d0d,0x8c6a3c,0xb08a52,0x6a2f18,0x9a9a9a];
const SHIRT=[0xffffff,0xdbe8f5,0xf2e6dc,0xcfe0cf,0xe8d8ef,0xf4f0e6];
const JACKET=[0x1f2a3d,0x2e3238,0x4a4f57,0x3d2f28,null,null,null];
const PANTS=[0x1e2533,0x2b2e33,0x3a3f47,0x6b5b47,0x24324a];
const SHOE=[0x161616,0x3a2414,0x221a14];

function makePerson(accent){
const root=new THREE.Group();
const skin=M(pick(SKIN),{roughness:.6});
const shirtColor=pick(SHIRT),jacket=pick(JACKET);
const top=M(jacket??shirtColor,{roughness:.85});
const sleeve=top;
const pants=M(pick(PANTS),{roughness:.9});
const shoe=M(pick(SHOE),{roughness:.4});
const hips=new THREE.Group();root.add(hips);
// pelvis + torso
box(.34,.16,.2,pants,0,.02,0,hips);
const spine=new THREE.Group();spine.position.y=.08;hips.add(spine);
const torso=cyl(.17,.15,.5,top,0,.26,0,spine,14);torso.scale.z=.62;
cyl(.2,.17,.12,top,0,.48,0,spine,14).scale.z=.62; // shoulders
if(jacket!==null){ // shirt collar + tie in the employee's colour
box(.11,.22,.02,M(shirtColor),0,.42,.1,spine);
box(.045,.3,.025,M(accent,{roughness:.5}),0,.33,.11,spine);
}else{
box(.04,.28,.025,M(accent,{roughness:.5}),0,.34,.1,spine);
}
// lanyard badge
box(.06,.08,.01,M(0xffffff),.08,.2,.105,spine);
cyl(.045,.05,.08,skin,0,.6,0,spine,10); // neck
const head=new THREE.Group();head.position.y=.74;spine.add(head);
const skull=new THREE.Mesh(new THREE.SphereGeometry(.11,24,18),skin);skull.scale.set(1,1.15,1.05);skull.castShadow=true;head.add(skull);
box(.02,.05,.03,skin,-.105,0,0,head);box(.02,.05,.03,skin,.105,0,0,head); // ears
const eyeM=M(0x1a1a1a,{roughness:.2});
box(.022,.014,.01,eyeM,-.04,.02,.11,head);box(.022,.014,.01,eyeM,.04,.02,.11,head);
const hairM=M(pick(HAIR),{roughness:.9});
const cap=new THREE.Mesh(new THREE.SphereGeometry(.118,24,14,0,Math.PI*2,0,Math.PI*.55),hairM);
cap.scale.set(1,1.1,1.08);cap.rotation.x=-.3;cap.position.y=.012;cap.castShadow=true;head.add(cap);
const style=Math.random();
if(style<.3)box(.2,.24,.06,hairM,0,-.08,-.08,head);          // long hair
else if(style<.45){const bun=new THREE.Mesh(new THREE.SphereGeometry(.05,12,10),hairM);bun.position.set(0,.06,-.12);head.add(bun);}
if(Math.random()<.25){ // glasses
const gm=M(0x111111,{roughness:.3});
box(.05,.03,.005,gm,-.042,.02,.118,head);box(.05,.03,.005,gm,.042,.02,.118,head);box(.03,.006,.005,gm,0,.025,.118,head);
}
// arms
const arm=s=>{
const sh=new THREE.Group();sh.position.set(s*.21,.48,0);spine.add(sh);
cyl(.048,.042,.29,sleeve,0,-.145,0,sh,10);
const el=new THREE.Group();el.position.y=-.29;sh.add(el);
cyl(.04,.034,.26,sleeve,0,-.13,0,el,10);
const hand=new THREE.Mesh(new THREE.SphereGeometry(.042,10,8),skin);hand.position.y=-.28;hand.scale.set(.8,1.1,.6);hand.castShadow=true;el.add(hand);
return{sh,el,hand};
};
const L=arm(-1),R=arm(1);
// legs
const leg=s=>{
const hp=new THREE.Group();hp.position.set(s*.095,0,0);hips.add(hp);
cyl(.068,.055,.45,pants,0,-.225,0,hp,10);
const kn=new THREE.Group();kn.position.y=-.45;hp.add(kn);
cyl(.052,.045,.44,pants,0,-.22,0,kn,10);
box(.09,.06,.25,shoe,0,-.46,.05,kn);
return{hp,kn};
};
const LL=leg(-1),RL=leg(1);
// coffee mug for breaks
const mug=cyl(.04,.035,.09,M(0xffffff),0,-.3,.04,R.el,12);mug.visible=false;
root.userData={hips,spine,head,L,R,LL,RL,mug};
root.traverse(o=>{if(o.isMesh)o.castShadow=true;});
return root;
}

// pose = {hipY,hip,knee,sh,el,lean} with left/right handled in animation
const POSE={
stand:{hipY:.95,hip:0,knee:0,shL:.05,shR:.05,elL:-.15,elR:-.15,lean:0},
sit:{hipY:.53,hip:-1.5,knee:1.5,shL:-.55,shR:-.55,elL:-1.05,elR:-1.05,lean:.12},
sitRelax:{hipY:.5,hip:-1.4,knee:1.35,shL:-.25,shR:-.25,elL:-1.0,elR:-1.0,lean:-.05},
coffee:{hipY:.95,hip:0,knee:0,shL:.05,shR:-.35,elL:-.15,elR:-1.55,lean:0},
board:{hipY:.95,hip:0,knee:0,shL:.05,shR:-2.3,elL:-.15,elR:-.5,lean:0},
};
const lerp=(a,b,t)=>a+(b-a)*t;

// ---------- static office ----------
const spots={};   // named places people walk to
function buildOffice(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0xdfe7ee);
camera=new THREE.PerspectiveCamera(42,1,.1,200);
renderer=new THREE.WebGLRenderer({canvas:$("office"),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;

scene.add(new THREE.HemisphereLight(0xf2f6ff,0x8a7560,1.3));

const ACTIVITIES=[["coffee",3],["water",2],["printer",2],["board",2],["meeting",3],["visit",3],["lounge",1],["window",1]];
function chooseActivity(p){
let total=ACTIVITIES.reduce((s,a)=>s+a[1],0),r=Math.random()*total;
for(const [name,w] of ACTIVITIES){
if((r-=w)>0)continue;
if(name==="visit"){
const others=desks.filter(d=>d.i!==p.i&&!people.some(o=>o.target===d.visit));if(!others.length)return null;
return pick(others).visit;
}
const free=spots[name].filter(s=>!people.some(o=>o!==p&&o.target===s));
if(!free.length)return null;
return pick(free);
}
return null;
}
function goTo(p,spot,then){
p.path=findPath(p.pos.x,p.pos.z,spot.x,spot.z);
p.target=spot;p.mode="walk";p.after=then;
}
function standThen(p,fn){p.mode="standing-up";p.timer=.8;p.next=fn;}
function planNext(p){
if(p.atDesk){
const act=chooseActivity(p);
if(!act){p.mode="rest";p.timer=rand(8,20);return;}
p.atDesk=false;drawScreen(desks[p.i],false);
standThen(p,()=>goTo(p,act,()=>arrive(p,act,rand(6,14))));
}else{
const home=desks[p.i].seat;
const go=()=>goTo(p,home,()=>{arrive(p,home,rand(14,40));p.atDesk=true;});
p.pose.hip<-.5?standThen(p,go):go();
}
}
function arrive(p,spot,duration){
p.mode="turn";p.faceTo=spot.face;p.pos.x=spot.x;p.pos.z=spot.z;
p.restPose=spot.pose;p.timer=duration;p.sitting=!!spot.sit;
}

const body=makePerson(d.color);
scene.add(body);
const p={i,body,u:body.userData,pos:{x:d.seat.x,z:d.seat.z},rot:Math.PI,
mode:"rest",restPose:"sit",timer:rand(3,25),atDesk:true,sitting:true,phase:Math.random()*10,
pose:{...POSE.sit},path:[],target:d.seat,talk:0};
body.traverse(o=>{if(o.isMesh){o.userData.roomIndex=i;clickable.push(o);}});
people.push(p);

function stepPerson(p,dt,t){
const sel=p.i===selected,urgent=sel&&busy;
// if you're talking to this employee, they hurry back to their desk
const home=desks[p.i].seat;
if(urgent&&!p.atDesk&&p.target!==home){
if(p.mode==="walk")goTo(p,home,()=>{arrive(p,home,rand(14,40));p.atDesk=true;});
else if(p.mode==="rest"||p.mode==="turn"){p.mode="rest";p.timer=0;}
}
let target=POSE[p.restPose]||POSE.stand,walking=false;
if(p.mode==="standing-up"){
target=POSE.stand;p.timer-=dt;
if(p.timer<=0){p.sitting=false;p.next();}
}else if(p.mode==="walk"){
walking=true;target=POSE.stand;
const wp=p.path[0];
if(!wp){p.mode="rest";p.after();}
else{
const dx=wp[0]-p.pos.x,dz=wp[1]-p.pos.z,dist=Math.hypot(dx,dz);
const speed=(urgent?1.9:1.25)*dt;
const want=Math.atan2(dx,dz);
let diff=((want-p.rot+Math.PI*3)%(Math.PI*2))-Math.PI;
p.rot+=diff*Math.min(1,dt*8);
if(dist<=speed){p.pos.x=wp[0];p.pos.z=wp[1];p.path.shift();}
else{const f=Math.abs(diff)>1.2?.3:1;p.pos.x+=dx/dist*speed*f;p.pos.z+=dz/dist*speed*f;}
p.phase+=speed*4.2;
}
}else if(p.mode==="turn"){
target=POSE.stand;
let diff=((p.faceTo-p.rot+Math.PI*3)%(Math.PI*2))-Math.PI;
p.rot+=diff*Math.min(1,dt*6);
if(Math.abs(diff)<.05){p.rot=p.faceTo;p.mode="rest";}
}else{ // resting: working, drinking coffee, in a meeting…
p.timer-=dt;
if(p.timer<=0&&!(urgent&&p.atDesk)){p.mode="planning";planNext(p);}
if(p.atDesk&&p.restPose==="sit"&&Math.random()<dt*(urgent?3:.8))drawScreen(desks[p.i],true);
}
// blend towards the target pose (gives smooth sitting down / standing up)
const k=Math.min(1,dt*(p.mode==="rest"&&p.sitting?4:6));
for(const key in target)p.pose[key]=lerp(p.pose[key],target[key],k);
const u=p.u,P=p.pose;
u.hips.position.y=P.hipY;
u.spine.rotation.x=P.lean;
let hipL=P.hip,hipR=P.hip,knL=P.knee,knR=P.knee,shL=P.shL,shR=P.shR,elL=P.elL,elR=P.elR;
if(walking){
const s=Math.sin(p.phase),c=Math.cos(p.phase);
hipL=s*.45;hipR=-s*.45;knL=Math.max(0,-c)*.8+.05;knR=Math.max(0,c)*.8+.05;
shL=-s*.35;shR=s*.35;elL=-.25;elR=-.25;
u.hips.position.y=.95+Math.abs(c)*.025;
u.spine.rotation.z=s*.03;
}else u.spine.rotation.z=0;
const typing=p.mode==="rest"&&p.restPose==="sit";
if(typing){const sp=urgent?.035:.016;elL+=Math.sin(t*sp+p.phase)*.06;elR+=Math.sin(t*sp+p.phase+2)*.06;}
if(p.mode==="rest"&&p.restPose==="board"){shR+=Math.sin(t*.004)*.15;elR+=Math.sin(t*.007)*.2;}
if(p.mode==="rest"&&p.restPose==="coffee"&&Math.sin(t*.0015+p.phase)>.85){shR=-1.0;elR=-2.0;}
if(p.mode==="rest"&&(p.restPose==="stand"||p.restPose==="sitRelax")){ // chatting: hand gestures
const gesture=Math.max(0,Math.sin(t*.002+p.phase));shL-=gesture*.5;elL-=gesture*.7;
}
u.LL.hp.rotation.x=hipL;u.RL.hp.rotation.x=hipR;u.LL.kn.rotation.x=knL;u.RL.kn.rotation.x=knR;
u.L.sh.rotation.x=shL;u.R.sh.rotation.x=shR;u.L.el.rotation.x=elL;u.R.el.rotation.x=elR;
u.L.sh.rotation.z=-.06;u.R.sh.rotation.z=.06;
u.mug.visible=p.restPose==="coffee"&&p.mode==="rest";
// head looks around naturally; looks at the screen when typing
u.head.rotation.y=typing?Math.sin(t*.0005+p.phase)*.12:Math.sin(t*.0008+p.phase)*.45;
u.head.rotation.x=typing?.12:Math.sin(t*.0011+p.phase)*.06;
p.body.position.set(p.pos.x,0,p.pos.z);
p.body.rotation.y=p.rot;
}

// Ask the selected employee. Returns the reply, or throws.
async function askEmployee(prompt,voice=false,images=[]){

const employee=rooms[selected];

addMessage(
"To "+employee.name+": "+(prompt||"(photo)"),
true,
images
);

const history=histories[employee.id]||(histories[employee.id]=[]);

addMessage(employee.name+" is thinking…");
busy=true;
const thinking=$("messages").lastChild;

try{

const response=await fetch(
serverURL()+"/api/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:prompt,
voice,
images,
history:history.slice(-16),
employee_id:"employee_"+employee.id,
employee:{
name:employee.name,
role:employee.role,
model:employee.model,
instructions:employee.instructions
}
}),
signal:AbortSignal.timeout(120000)
}
);

const data=await response.json().catch(()=>({}));

if(data.need_vision)$("visionButton").style.display="inline-block";

if(!response.ok)
throw Error(data.error||("HTTP "+response.status));

const reply=data.reply||data.response||
"No response received.";

addMessage(employee.name+": "+reply,false,data.image?[data.image]:[]);
if(voicesOn&&!voice&&!call.active&&window.speechSynthesis)speak(reply.slice(0,600));

history.push(
{role:"user",content:prompt},
{role:"assistant",content:reply}
);
history.splice(0,Math.max(0,history.length-16));

return reply;

}finally{
busy=false;
thinking.remove();
}
}

// Shrink big photos so they send quickly (max 1600px, JPEG).
function loadPhoto(file){
return new Promise((resolve,reject)=>{
const img=new Image();
img.onload=()=>{
const scale=Math.min(1,1600/Math.max(img.width,img.height));
const c=document.createElement("canvas");
c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
c.getContext("2d").drawImage(img,0,0,c.width,c.height);
URL.revokeObjectURL(img.src);
resolve(c.toDataURL("image/jpeg",.88));
};
img.onerror=()=>reject(Error("Couldn't read "+file.name));
img.src=URL.createObjectURL(file);
});
}

$("photoInput").addEventListener("change",async e=>{
for(const file of [...e.target.files].slice(0,3-pendingPhotos.length)){
try{pendingPhotos.push(await loadPhoto(file));}catch(err){addMessage(err.message);}
}
e.target.value="";
showPending();
});

e.preventDefault();

});

if(v.installed){clearInterval(poll);$("visionButton").style.display="none";$("visionButton").disabled=false;
addMessage("Photo brain installed. Send a photo now!");return;}
if(v.error&&!v.running){clearInterval(poll);$("visionButton").disabled=false;addMessage("Download problem: "+v.error);return;}
$("visionButton").textContent="⬇ Downloading "+v.percent+"%";
},3000);
};

window.sendMessage=async function(){

const prompt=$("prompt").value.trim();
const images=pendingPhotos;

if(!prompt&&!images.length)return;

$("prompt").value="";
pendingPhotos=[];showPending();

try{
await askEmployee(prompt,false,images);
}catch(error){
addMessage(/vision|photo/i.test(error.message)?error.message:
"Echo is not connected yet. "+
"Start the Python backend and Ollama. "+
error.message
);
}
};

// ==========================================
// CALL ECHO: hands-free voice conversation
// ==========================================

const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

const call={active:false,state:"idle",recognizer:null};

function setCallState(state,text){
call.state=state;
$("callStatus").textContent=text;
$("callButton").textContent=call.active?"📞 Hang up":"🎙️ Talk to "+rooms[selected].name;
$("callButton").classList.toggle("oncall",call.active);
$("interruptButton").style.display=
call.active&&state==="speaking"?"inline-block":"none";
}

// Pick the most natural English voice available (Edge/Chrome online
// voices sound best), preferring an Australian accent.
function pickVoice(){
const voices=speechSynthesis.getVoices()
.filter(v=>v.lang.toLowerCase().startsWith("en"));
const score=v=>
(/natural|online|neural/i.test(v.name)?4:0)+
(/en-au/i.test(v.lang)?2:0)+
(/google/i.test(v.name)?1:0);
return voices.sort((a,b)=>score(b)-score(a))[0]||null;
}

function speakable(text){
return text
.replace(/```[\s\S]*?```/g," ")
.replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
.replace(/[*_#`>|~]/g,"")
.replace(/^\s*[-•]\s+/gm,"")
.replace(/\s+/g," ")
.trim();
}

// What each office says when you click into it: what they do, and what they need from you.
const INTROS={
"Content Creator":"Hey, I'm your Content Creator. I find trending ideas, plan videos and clips, and write captions and hashtags. With OpusClip connected I can clip your Twitch streams and long videos into Shorts. Send me a video link and tell me where to post.",
"Trading Analyst":"Hi, Trading Analyst here. I research markets and explain what's moving. For trade ideas with charts, head over to the Day Trading Desk.",
"Shopify Manager":"Hey, Shopify Manager here. I research profitable products, write descriptions, check competitors' prices and find ways to grow sales. To manage your real store I'll need a Shopify connection, so for now tell me what you sell and I'll get planning.",
"Website and Leads Manager":"Hi, I'm the Website and Leads Manager. Every day at 3 PM I find 20 local businesses that need a website, with phones, emails and photos, ready to build in Base44. I just need your Google Places key to start. Ask me for your leads.",
"Research Agent":"Hey, Research Agent here. I hunt for new AI tools, income opportunities and ways to upgrade Echo. Ask me to look into anything.",
"Technical Support":"Hi, I'm Technical Support. If anything in Echo breaks or looks wrong, tell me what happened and I'll help sort it.",
"Communications Assistant":"Hey, Communications here. I draft your messages and emails, and once your phone line is set up I can ring you.",
"Operations Manager":"Hi, Operations Manager. I keep an eye on every employee and every part of Echo, and send your reports at 6:30, 1 and 5:30. Say status to check everything's running, or records to see what got done today.",
"Roblox Map Builder":"Hey! Roblox Map Builder here. Tell me what to build, like a snowy obby with 20 stages or a big night city, and I'll build it straight into Roblox Studio.",
"Sales Agent":"Hey! Sales Agent here. I turn the daily leads into clients. Say pipeline to see everyone, pitch and a business name for a personalised message, and mark them contacted or won as you go. I'll remind you about follow-ups. I draft, you send.",
"Marketing Manager":"Hi, Marketing Manager. I plan ad campaigns, check out competitors, spot trends and find ways to get more traffic and sales. I never spend on ads without your OK. What are we promoting?",
"Finance Manager":"Hi, Finance Manager here. Tell me income five hundred website for Joe, or expense thirty OpusClip, and I'll keep the books. Say money for this month's profit.",
"Customer Support":"Hey, Customer Support. Tell me enquiry, a name, and their message, and I'll log it and draft a reply. Urgent ones get flagged to you straight away.",
"CEO":"Hi Tailen, I'm the CEO. I keep the whole office pointed at your goals. Tell me my goal is, and what you want, and I'll set priorities and delegate. Every evening at six I send you the business summary. Say summary any time.",
"Day Trading Desk":"Hi, Day Trading Desk. I scan the market every weekday evening and tell you up, down or wait, with a chart. Say market, scan, or analyse a stock. I only place a trade when you approve it."
};

// Each office gets its own voice: a different speaker where the browser has
// several, plus its own pitch and speed.
let voicesOn=true;
try{voicesOn=localStorage.getItem("echo_voices")!=="off";}catch{}
function voiceFor(i){
const all=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith("en"));
const score=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/en-au/i.test(v.lang)?2:0)+(/google/i.test(v.name)?1:0);
const ranked=all.sort((a,b)=>score(b)-score(a));
const good=ranked.filter(v=>score(v)>=score(ranked[0]||{name:"",lang:""})-2);
const pool=good.length>1?good:ranked;
const pitches=[1,.85,1.15,.95,1.1,.8,1.2,1,.9,1.05];
const rates=[1.05,1,1.08,.98,1.1,1,1.03,.97,1.12,1.02];
return{voice:pool.length?pool[i%pool.length]:null,pitch:pitches[i%10],rate:rates[i%10]};
}

window.toggleVoices=function(){
voicesOn=!voicesOn;
try{localStorage.setItem("echo_voices",voicesOn?"on":"off");}catch{}
$("voicesButton").textContent=voicesOn?"🔊 Voices on":"🔇 Voices off";
if(!voicesOn)speechSynthesis.cancel();
};

function introFor(r){
return INTROS[r.name]||("Hi, I'm "+r.name+", your "+(r.role||"assistant")+". Tell me what you need.");
}

// Speak sentence by sentence: Chrome cuts off long single utterances.
function speak(text){
return new Promise(resolve=>{
speechSynthesis.cancel();
call.doneSpeaking=resolve;
const parts=speakable(text).match(/[^.!?]+[.!?]*/g)||[""];
const v=voiceFor(selected);
parts.forEach((part,i)=>{
const utterance=new SpeechSynthesisUtterance(part.trim());
if(v.voice)utterance.voice=v.voice;
utterance.rate=v.rate;
utterance.pitch=v.pitch;
if(i===parts.length-1){
utterance.onend=resolve;
utterance.onerror=resolve;
}
speechSynthesis.speak(utterance);
});
});
}

function listen(){
if(!call.active)return;

const recognizer=new Recognition();
call.recognizer=recognizer;
recognizer.lang="en-AU";
recognizer.interimResults=true;
recognizer.continuous=false;

let heard="";

recognizer.onresult=e=>{
heard=Array.from(e.results).map(r=>r[0].transcript).join("");
$("callStatus").textContent="🎙️ "+heard;
};

recognizer.onerror=e=>{
if(e.error==="not-allowed"||e.error==="service-not-allowed"){
addMessage("Microphone blocked. Allow the microphone for this page, then call again.");
endCall();
}
};

recognizer.onend=async()=>{
call.recognizer=null;
if(!call.active)return;
heard=heard.trim();
if(!heard){listen();return;}
if(/^(bye|goodbye|hang up|end call)\b/i.test(heard)){
await speak("Talk soon.");
endCall();
return;
}
setCallState("thinking","💭 Thinking…");
try{
const reply=await askEmployee(heard,true);
if(!call.active)return;
setCallState("speaking","🔊 Speaking… (tap Interrupt to talk)");
await speak(reply);
}catch(error){
addMessage("Echo couldn't answer: "+error.message);
if(call.active)await speak("Sorry, I couldn't reach my brain. Check that Ollama is running.");
}
if(call.active){
setCallState("listening","🎙️ Listening…");
listen();
}
};

setCallState("listening","🎙️ Listening…");
recognizer.start();
}

function endCall(){
call.active=false;
speechSynthesis.cancel();
if(call.doneSpeaking)call.doneSpeaking();
if(call.recognizer){
try{call.recognizer.abort();}catch{}
call.recognizer=null;
}
setCallState("idle","");
}

window.toggleCall=async function(){
if(call.active){endCall();return;}
if(!Recognition||!window.speechSynthesis){
addMessage("Voice calls need Google Chrome or Microsoft Edge.");
return;
}
call.active=true;
const employee=rooms[selected];
addMessage("📞 Call started with "+employee.name+". Say \"bye\" or tap Hang up to end.");
setCallState("speaking","🔊 Speaking…");
await speak("Hi, it's "+employee.name+". What do you need?");
listen();
};

// Stop talking so you can speak (like interrupting on a real call).
window.interruptEcho=function(){
if(call.active&&call.state==="speaking"){
speechSynthesis.cancel();
if(call.doneSpeaking)call.doneSpeaking();
}
};

// Ask Echo's phone line (Twilio) to call your mobile.
window.ringMyPhone=async function(){
try{
const response=await fetch(serverURL()+"/api/call-me",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:"{}"
});
const data=await response.json().catch(()=>({}));
addMessage(data.message||data.error||("HTTP "+response.status));
}catch(error){
addMessage("Echo's server isn't running: "+error.message);
}
};

// Voices load asynchronously in some browsers.
if(window.speechSynthesis)speechSynthesis.getVoices();

rebuild();
selectRoom(0);
resize();
updateCamera();

if(THREE)requestAnimationFrame(animate);

addMessage("Welcome to Echo Headquarters. Click any office to talk to that employee.");
if(!voicesOn)$("voicesButton").textContent="🔇 Voices off";

// When opened from the Echo server, talk to that same server.
if(location.protocol.startsWith("http"))
$("server").value=location.origin;

testConnection();

// Enter sends; Shift+Enter adds a new line.
$("prompt").addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

</script>
